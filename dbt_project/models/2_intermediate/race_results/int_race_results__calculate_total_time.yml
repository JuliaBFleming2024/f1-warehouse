version: 2

models:
  - name: int_race_results__calculate_total_time
    description: >
      Transforms interval time (where race winner's time represents their full race duration and all 
        other finisher's time represents delta from the previous finisher) to 
        total time (finisher's start to finish time).
    columns:
      - name: driver_race_id
        data_type: text
        description: "Primary Key. Generated id unique to the a Grand Prix location, year, and a driver."
        tests:
          - not_null
          - unique

      - name: event_weekend_id
        data_type: text
        description: Generated key unique to a year and an event name. 

      - name: driver_number
        data_type: character varying
        description: "Number of driver. Note these change frequently year over year."

      - name: starting_grid_position
        data_type: integer
        description: "Position in which driver started at the race start."

      - name: position
        data_type: integer
        description: "Finishing position of the driver. Null value means that driver did not finish."

      - name: classified_position
        data_type: character varying
        description: "Finishing Position of the driver. A Number indictates the order in which the driver finished, Did not Start or Retired"
        
      - name: is_completed_race
        data_type: boolean
        description: >
          True if driver completed all race laps. This includes drivers later disqualified.

      - name: interval_time__ns
        data_type: numeric
        description: "Finishing time in nanoseconds. This is the entire length of the race for the race winner.
          For all other finishers, this time represents their delta from the finisher on position earlier. Null 
          time indicates the driver did not finish the race."

      - name: interval_time__formatted
        data_type: text
        description: "Finishing interval time in format Hours:Minutes:Seconds:Milliseconds. This is the entire length of the race for the race winner.
          For all other finishers, this time represents their delta from the finisher on position earlier. Null 
          time indicates the driver did not finish the race."

      - name: total_time__ns
        data_type: numeric
        description: "Driver's total race time if the driver finished the race."

      - name: total_time__formatted
        data_type: text
        description: "Driver's total race time in format Hours:Minutes:Seconds:Milliseconds if the driver completed the race."

      - name: points_awarded
        data_type: integer
        description: "Number of points driver was awarded from the race."